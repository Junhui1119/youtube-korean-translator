<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>生成插件图标</title>
  <style>
    body { font-family: system-ui; padding: 20px; }
    .icon-row { display: flex; gap: 20px; align-items: flex-end; margin: 20px 0; }
    canvas { border: 1px solid #eee; image-rendering: pixelated; }
    a { display: block; margin-top: 6px; font-size: 12px; }
  </style>
</head>
<body>
  <h2>韩语字幕插件图标生成器</h2>
  <p>点击下方链接下载各尺寸 PNG，保存到 <code>icons/</code> 目录。</p>
  <div class="icon-row" id="icons"></div>
  <script>
    function drawIcon(size) {
      const canvas = document.createElement("canvas");
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext("2d");

      // 圆角背景
      const r = size * 0.18;
      ctx.fillStyle = "#1a1a2e";
      ctx.beginPath();
      ctx.moveTo(r, 0);
      ctx.lineTo(size - r, 0);
      ctx.quadraticCurveTo(size, 0, size, r);
      ctx.lineTo(size, size - r);
      ctx.quadraticCurveTo(size, size, size - r, size);
      ctx.lineTo(r, size);
      ctx.quadraticCurveTo(0, size, 0, size - r);
      ctx.lineTo(0, r);
      ctx.quadraticCurveTo(0, 0, r, 0);
      ctx.closePath();
      ctx.fill();

      // "韩" 文字
      ctx.fillStyle = "#ffffff";
      ctx.font = `bold ${Math.round(size * 0.58)}px system-ui`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("韩", size / 2, size * 0.52);

      return canvas;
    }

    const container = document.getElementById("icons");
    [16, 48, 128].forEach((size) => {
      const canvas = drawIcon(size);
      const div = document.createElement("div");

      const label = document.createElement("p");
      label.textContent = `${size}×${size}`;
      label.style.margin = "0 0 4px";
      label.style.fontSize = "12px";

      const a = document.createElement("a");
      a.href = canvas.toDataURL("image/png");
      a.download = `icon-${size}.png`;
      a.textContent = `↓ icon-${size}.png`;

      div.appendChild(label);
      div.appendChild(canvas);
      div.appendChild(a);
      container.appendChild(div);
    });
  </script>
</body>
</html>
