<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>韩语→中文字幕</title>
    <style>
      body {
        width: 220px;
        margin: 0;
        padding: 14px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        font-size: 14px;
      }

      input[type="checkbox"] {
        width: 18px;
        height: 18px;
      }

      .status {
        margin: 10px 0 0;
        font-size: 12px;
        color: #666;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .status::before {
        content: "";
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
        background: #ccc;
      }

      .status.on::before {
        background: #22c55e;
      }

      .status.degraded::before {
        background: #eab308;
      }

      .divider {
        margin: 12px 0;
        border: none;
        border-top: 1px solid #eee;
      }

      .key-row {
        display: flex;
        gap: 6px;
        align-items: center;
      }

      .key-label {
        font-size: 11px;
        color: #999;
        margin: 0 0 4px;
      }

      input[type="text"] {
        flex: 1;
        font-size: 11px;
        padding: 4px 6px;
        border: 1px solid #ddd;
        border-radius: 4px;
        outline: none;
        min-width: 0;
      }

      input[type="text"]:focus {
        border-color: #888;
      }

      .save-btn {
        font-size: 11px;
        padding: 4px 8px;
        border: 1px solid #ddd;
        border-radius: 4px;
        background: #f5f5f5;
        cursor: pointer;
        white-space: nowrap;
      }

      .save-btn:hover {
        background: #e8e8e8;
      }

      .engine-tag {
        font-size: 10px;
        color: #999;
        margin: 4px 0 0;
      }

      .engine-tag.deepl {
        color: #0f62e6;
      }
    </style>
  </head>
  <body>
    <label>
      <span>显示中文字幕</span>
      <input id="enabled" type="checkbox" />
    </label>
    <p id="status" class="status">翻译已关闭</p>

    <hr class="divider" />

    <p class="key-label">DeepL API Key（留空则用 Google 翻译）</p>
    <div class="key-row">
      <input id="apiKey" type="text" placeholder="粘贴你的 DeepL key" />
      <button id="saveKey" class="save-btn">保存</button>
    </div>
    <p id="engineTag" class="engine-tag"></p>

    <hr class="divider" />

    <p class="key-label">后端设置（可选）</p>
    <div class="key-row">
      <input id="backendUrl" type="text" placeholder="https://your-backend.onrender.com" style="font-size:11px;padding:4px 6px;" />
    </div>
    <div class="key-row" style="margin-top:6px;">
      <input id="backendToken" type="text" placeholder="Bearer token" />
      <button id="saveBackend" class="save-btn">保存</button>
    </div>
    <p id="backendTag" class="engine-tag"></p>

    <script src="popup.js" type="module"></script>
  </body>
</html>
